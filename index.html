<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Gear Gun Castle</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b0c10;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 32px rgba(0, 0, 0, 0.9);
      background-color: #090a0f;
    }
    canvas {
      display: block;
    }
  </style>
  <script>
    window.addEventListener('error', function(e) {
      console.error('GLOBAL ERROR:', e);
      var d = document.getElementById('error-banner');
      if (!d) {
        d = document.createElement('div');
        d.id = 'error-banner';
        d.style.position = 'fixed';
        d.style.top = '10px';
        d.style.left = '10px';
        d.style.right = '10px';
        d.style.background = '#dc2626';
        d.style.color = '#ffffff';
        d.style.padding = '16px';
        d.style.borderRadius = '8px';
        d.style.zIndex = '9999999';
        d.style.fontSize = '13px';
        d.style.fontFamily = 'monospace';
        d.style.whiteSpace = 'pre-wrap';
        document.body.appendChild(d);
      }
      d.innerText = 'LỖI RUNTIME: ' + (e.message || e) + '\nTại: ' + (e.filename || '') + ':' + (e.lineno || '');
    });
  </script>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
